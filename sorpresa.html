<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Una sorpresa para ti ♥️</title>

    <style>

        * {  
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at top, #14245c, #050816 75%);

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .contenedor {
            width: 90%;
            max-width: 900px;
            text-align: center;
        }

        .mini {
            color: #00bfff;
            letter-spacing: 5px;
            font-size: 12px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 50px;
            margin-bottom: 10px;

            text-shadow:
                0 0 10px #00bfff,
                0 0 25px #00bfff;
        }

        .descripcion {
            color: #fefbff;
            margin-bottom: 40px;
        }

        /* REGALOS */

        .regalos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .regalo {
            height: 250px;

            border: 1px solid #00bfff;

            border-radius: 25px;

            background: rgba(20, 36, 92, 0.8);

            color: #00bfff;

            cursor: pointer;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            transition: 0.3s;

            box-shadow:
                0 0 10px rgba(0, 191, 255, 0.3);
        }

        .regalo:hover {
            transform: translateY(-10px);

            box-shadow:
                0 0 15px #00bfff,
                0 0 35px rgba(0, 191, 255, 0.5);
        }

        .icono {
            font-size: 70px;
            margin-bottom: 20px;

            filter:
                drop-shadow(0 0 10px #00bfff);
        }

        .regalo h2 {
            color: #00bfff;
            margin-bottom: 8px;
        }

        .regalo p {
            color: #b9eaff;
            font-size: 14px;
        }

        /* CORAZONES */

        .corazon {
            position: absolute;

            color: #00bfff;

            font-size: 30px;

            opacity: .3;

            animation: flotar 5s infinite ease-in-out;
        }

        .uno {
            top: 10%;
            left: 10%;
        }

        .dos {
            top: 20%;
            right: 10%;
            animation-delay: 1s;
        }

        .tres {
            bottom: 15%;
            left: 15%;
            animation-delay: 2s;
        }

        .cuatro {
            bottom: 10%;
            right: 15%;
            animation-delay: 3s;
        }

        @keyframes flotar {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }

        }

        .volver {
            display: block;
            position: absolute;
            top: 90%;
            left: 50%;
            transform: translate(-50%, -60%);

            margin: 40px auto 20;
            padding: 13px 25px;

            border: 1px solid #00bfff;

            border-radius: 30px;

            background: transparent;

            color: #00bfff;

            cursor: pointer;

            transition: .3s;

            box-shadow:
                0 0 10px rgba(0, 191, 255, 0.3);
        }

        .volver:hover {
            background: #00bfff;
            color: #050816;

            box-shadow:
                0 0 20px #00bfff;
        }


        /* CELULAR */

        @media (max-width: 700px) {

            h1 {
                font-size: 38px;
            }

            .regalos {
                grid-template-columns: 1fr;
            }

            .regalo {
                height: 170px;
            }

            .icono {
                font-size: 50px;
                margin-bottom: 10px;
            }

        }

    </style>

</head>


<body>

    <!-- CORAZONES -->

    <div class="corazon uno">♡</div>
    <div class="corazon dos">♥</div>
    <div class="corazon tres">♡</div>
    <div class="corazon cuatro">♥</div>


    <div class="contenedor">

        <h1>
            Elige un regalo 💜
        </h1>

        <p class="descripcion">
            Cada uno guarda algo especial para ti.
        </p>


        <!-- REGALOS -->

        <div class="regalos">


           <button class="regalo" onclick="location.href='recuerdos.html'">

                <div class="icono">
                    🎁
                </div>

                <h2>
                    Recuerdos
                </h2>

                <p>
                    Algunos momentos nuestros
                </p>

            </button>



            <button class="regalo" onclick="location.href='para-ti.html'">

                <div class="icono">
                    💜
                </div>

                <h2>
                    Para ti
                </h2>

                <p>
                    50 Cosas Que Amo De Ti
                </p>

            </button>



            <button class="regalo" onclick="location.href='carta.html'">

                <div class="icono">
                    💌
                </div>

                <h2>
                    Una carta
                </h2>

                <p>
                    Algo escrito especialmente para ti
                </p>

            </button>

            <button class="volver" onclick="location.href='Index.html'">

                ← Volver a la pagina principal

            </button>

        </div>

    </div>



    <script>

        function recuerdos() {

            alert("Aquí pondremos sus fotos 📸");

        }


        function razones() {

            alert("Aquí pondremos tus mensajes 💙");

        }


        function carta() {

            alert("Aquí pondremos tu carta 💌");

        }

    </script>


</body>

</html>
