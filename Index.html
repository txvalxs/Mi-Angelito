<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para ti Mi Angelito❤️</title>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Poppins", sans-serif;

            background: linear-gradient(
                135deg,
                #14245c,
                #050816
            );

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        /* Corazones del fondo */
        .corazon {
            position: absolute;
            font-size: 35px;
            opacity: 0.25;
            color: #00bfff;
            animation: flotar 5s infinite ease-in-out;
        }

        .c1 {
            top: 10%;
            left: 10%;
        }

        .c2 {
            top: 20%;
            right: 12%;
            animation-delay: 1s;
        }

        .c3 {
            bottom: 15%;
            left: 15%;
            animation-delay: 2s;
        }

        .c4 {
            bottom: 10%;
            right: 15%;
            animation-delay: 3s;
        }

        @keyframes flotar {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        /* Contenido principal */
        .contenedor {
            width: 90%;
            max-width: 700px;
            text-align: center;
            z-index: 2;
        }

        .mini {
            font-size: 12px;
            letter-spacing: 5px;
            margin-bottom: 20px;
            opacity: 0.65;
            color: #00bfff;
        }

        h1 {
            font-family: "DM Serif Display", serif;
            font-size: clamp(50px, 10vw, 85px);
            line-height: 1;
            font-weight: normal;

            text-shadow:
                0 0 10px #00bfff,
                0 0 25px #00bfff;
        }

        h1 span {
            color: #00bfff;
        }

        .descripcion {
            margin: 25px auto;
            max-width: 480px;
            line-height: 1.7;
            font-size: 15px;
            color: #dff8ff;
        }

        /* Botón */
        .boton {
            border: 1px solid #00bfff;
            background: transparent;
            color: #00bfff;

            padding: 15px 30px;

            border-radius: 50px;

            font-size: 15px;

            cursor: pointer;

            box-shadow:
                0 0 10px rgba(0, 191, 255, 0.3);

            transition: 0.3s;
        }

        .boton:hover {
            transform: translateY(-5px);

            background: #00bfff;
            color: #050816;

            box-shadow:
                0 0 20px #00bfff,
                0 0 35px rgba(0, 191, 255, 0.5);
        }

        .firma {
            margin-top: 30px;
            font-size: 13px;
            color: #dff8ff;
        }

        .firma span {
            font-weight: 600;
            color: #00bfff;
        }


        /* Adaptación para celular */
        @media (max-width: 600px) {

            h1 {
                font-size: 55px;
            }

            .descripcion {
                font-size: 14px;
            }

            .corazon {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- Corazones -->
    <div class="corazon c1">♡</div>
    <div class="corazon c2">♥</div>
    <div class="corazon c3">♡</div>
    <div class="corazon c4">♥</div>


    <!-- Página principal -->
    <div class="contenedor">


        <h1>
            Una pequeña<br>
            <span>sorpresa</span> ♡
        </h1>

        <p class="descripcion">
            Hice esto especialmente para ti.
            Un pequeño regalo por tu cumpleaños...
        </p>

        <button class="boton" onclick="location.href='sorpresa.html'">
    Abrir mi sorpresa  💜
</button>

        <p class="firma">
            Con amor,
            <span>El Amor de tu Vida</span>
        </p>

    </div>


    <script>

        function abrirSorpresa() {

            alert("Aquí aparecerá la siguiente página 💗");

            // Después podemos hacer que este botón
            // lleve directamente a la página de regalos.
        }

    </script>

</body>
</html>
